name: Deploy site

# Builds web/app_data.js from data/snapshots and publishes web/ to GitHub Pages.
# Runs on every push to main, and is called by the Refresh data workflow after it
# commits new snapshots (pushes made by a workflow don't trigger other workflows).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main, so a refresh's just-pushed snapshot commit is included.
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-dev
      - run: uv run d3soccer build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
