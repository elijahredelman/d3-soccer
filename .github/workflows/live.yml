name: Live scores

# Redeploys the site every 10 minutes while NCAA tournament games are on, so scores and
# box scores stay current (deploys run `d3soccer live`). Nothing is committed.
# Windows are in UTC: games start 11 a.m.-7:30 p.m. ET (16:00-00:30 UTC).
# Remove after the final (Dec. 5).
on:
  schedule:
    - cron: "*/10 16-23 13-15,20-22 11 *"
    - cron: "*/10 0-3 14-16,21-23 11 *"
    - cron: "*/10 16-23 3,5 12 *"
    - cron: "*/10 0-3 4 12 *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/pages.yml
